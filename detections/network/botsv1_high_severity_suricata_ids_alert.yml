name: BOTSv1 High Severity Suricata IDS Alert
id: f5c92d84-3b17-4e26-a09f-8d1c4b6e7203
version: 1
date: '2026-07-29'
author: jesse12-21
status: production
type: Anomaly
description: Converts high-severity Suricata IDS alerts into risk contributions rather
  than notables. This is the Splunk half of the pipeline built in the companion suricata-ids-rules
  project — rules authored and engine-validated there emit EVE JSON, which is ingested
  here and normalised to the Intrusion_Detection data model.
  Treating IDS alerts as risk rather than as individual notables is the point. A sensor
  producing thousands of alerts a day is unusable as an alert source but valuable as
  a risk source, because the volume that makes it noisy is exactly what makes it useful
  for accumulating score against an entity.
data_source:
- Suricata EVE JSON
search: '| tstats `security_content_summariesonly` count as alert_count, values(IDS_Attacks.signature)
  as signatures, dc(IDS_Attacks.signature) as unique_signatures, min(_time) as firstTime,
  max(_time) as lastTime from datamodel=Intrusion_Detection.IDS_Attacks where IDS_Attacks.severity
  IN ("critical","high") by IDS_Attacks.src, IDS_Attacks.dest | `drop_dm_object_name(IDS_Attacks)`
  | where alert_count > 5 | `security_content_ctime(firstTime)` | `security_content_ctime(lastTime)`
  | `botsv1_high_severity_suricata_ids_alert_filter`'
how_to_implement: Requires Suricata EVE JSON ingested and normalised to the Intrusion_Detection
  data model. The inputs.conf and props.conf stanzas are in docs/integrations.md. Severity
  mapping is TA-dependent — Suricata emits numeric severity 1-3 in EVE JSON, and the
  add-on maps these to the CIM severity vocabulary. Verify that mapping in your environment
  before relying on the severity filter.
known_false_positives: IDS false positives become risk contributions rather than alerts,
  which is the intent, but a badly tuned sensor will still inflate entity scores. Tune
  at the sensor first — see the tuning guide in the suricata-ids-rules project — and
  use finding exclusion rules in ES for the remainder.
references:
- https://github.com/jesse12-21/suricata-ids-rules
- https://docs.suricata.io/en/latest/output/eve/eve-json-format.html
drilldown_searches:
- name: View the detection results for $src$
  search: '%original_detection_search% | search src = $src$'
  earliest_offset: $info_min_time$
  latest_offset: $info_max_time$
- name: View risk events for the last 7 days for $src$
  search: '| from datamodel Risk.All_Risk | search normalized_risk_object IN ($src$)
    starthoursago=168 | stats count values(search_name) as "Search Name" values(risk_message)
    as "Risk Message" by normalized_risk_object'
  earliest_offset: $info_min_time$
  latest_offset: $info_max_time$
rba:
  message: $src$ triggered $alert_count$ high-severity IDS alerts against $dest$ across
    $unique_signatures$ distinct signatures.
  risk_objects:
  - field: src
    type: system
    score: 45
  threat_objects:
  - field: signatures
    type: signature
tags:
  analytic_story: [BOTSv1 Network Threats]
  asset_type: Network
  mitre_attack_id: [T1595]
  product: [Splunk Enterprise, Splunk Enterprise Security, Splunk Cloud]
  security_domain: network
  manual_test: Validated by hand against Suricata EVE JSON generated by the companion
    suricata-ids-rules project. Automated testing would require shipping a PCAP replay
    and a full Suricata deployment, which is out of scope for this repository.
