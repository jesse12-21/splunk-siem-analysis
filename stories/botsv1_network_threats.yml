description: Detections built on network sensor telemetry, including Suricata IDS
  alerts produced by the companion suricata-ids-rules project.
narrative: Network sensor alerts are high-volume and low-context on their own. Converting
  them to risk contributions rather than notables lets IDS signal accumulate against
  an entity alongside endpoint and web evidence, which is the pattern that makes a
  multi-stage intrusion visible as one story instead of thirty alerts.
