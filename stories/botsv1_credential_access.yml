name: BOTSv1 Credential Access
id: 7d4c2e19-8a3b-4f60-b12d-5e9a0c3f7b48
version: 1
date: '2026-07-29'
author: jesse12-21
status: production
description: Detections covering credential access activity observed in the Boss of
  the SOC v1 dataset, including password guessing against Windows hosts and successful
  authentication following a burst of failures.
narrative: The BOTSv1 scenario includes an external actor probing internet-facing services
  and attempting authentication against Windows infrastructure. These detections surface
  that activity as risk against the source address and the targeted account, rather
  than as individual alerts, so that a sustained campaign accumulates score across
  several signals instead of generating one notable per failed logon burst.
references:
- https://attack.mitre.org/tactics/TA0006/
- https://github.com/splunk/botsv1
