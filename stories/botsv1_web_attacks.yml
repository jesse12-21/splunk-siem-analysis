description: Detections covering web application attack activity in the Boss of the
  SOC v1 dataset, including injection attempts and automated content discovery.
narrative: The BOTSv1 scenario opens with reconnaissance and exploitation against a
  public-facing web application. Grouping these detections into one story means a
  single actor moving from scanning through injection accumulates risk against their
  source address rather than producing unconnected alerts.
